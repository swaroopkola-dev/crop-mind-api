[project]
name = "cropmind-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.8.1",
  "pymongo==4.11.3",
  "pyjwt==2.10.1",
  "pwdlib[argon2,bcrypt]==0.2.1",
  "email-validator==2.2.0",
  "httpx==0.28.1",
  "google-genai==1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP017", "UP042", "I001", "F401"]
